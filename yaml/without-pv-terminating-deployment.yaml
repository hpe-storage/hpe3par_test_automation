---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-monitor-delete-dep-without-pv
  namespace: hpe-storage
spec:
  selector:
    matchLabels:
      app: nginx-without-pv
  replicas: 1
  template:
    metadata:
      labels:
        monitored-by: hpe-csi
        app: nginx-without-pv
    spec:
      containers:
      - name: nginx
        image: nginx:1.14.2
        ports:
        - containerPort: 80
        volumeMounts:
        - mountPath: /usr/share/nginx/html/
          name: nginx-index
      volumes:
      - name: nginx-index
        emptyDir: {}
      initContainers:
      - name: init01
        image: centos:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: VES_IO_SITENAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        args:
        - /bin/sh
        - -c
        - echo $VES_IO_SITENAME $HOSTNAME >> /tmp/index.html
        volumeMounts:
        - mountPath: /tmp
          name: nginx-index